resources:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: cattle-fleet-system
- apiVersion: v1
  kind: Namespace
  metadata:
    name: cattle-system
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: harvester-cluster-repo
    namespace: cattle-system
  spec:
    selector:
      matchLabels:
        app: harvester-cluster-repo
    replicas: 1
    template:
      metadata:
        labels:
          app: harvester-cluster-repo
      spec:
        containers:
        - name: httpd
          image: $CLUSTER_REPO_IMAGE
          ports:
          - containerPort: 80
          readinessProbe:
            httpGet:
              path: /charts/index.yaml
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
- apiVersion: v1
  kind: Service
  metadata:
    name: harvester-cluster-repo
    namespace: cattle-system
  spec:
    selector:
      app: harvester-cluster-repo
    ports:
      - protocol: TCP
        port: 80
        targetPort: 80
- apiVersion: helm.cattle.io/v1
  kind: HelmChart
  metadata:
    name: fleet-crd
    namespace: cattle-fleet-system
  spec:
    chart: fleet-crd
    version: $FLEET_CHART_VERSION
    createNamespace: true
    targetNamespace: cattle-fleet-system
    repo: http://harvester-cluster-repo.cattle-system.svc/charts
- apiVersion: helm.cattle.io/v1
  kind: HelmChart
  metadata:
    name: fleet
    namespace: cattle-fleet-system
  spec:
    chart: fleet
    version: $FLEET_CHART_VERSION
    createNamespace: true
    targetNamespace: cattle-fleet-system
    repo: http://harvester-cluster-repo.cattle-system.svc/charts
