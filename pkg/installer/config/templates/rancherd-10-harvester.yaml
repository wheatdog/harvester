resources:
# create the cattle-monitoring-system namespace and SA upfront, so that kubevirt monitoring-operator integration can find it
- apiVersion: v1
  kind: Namespace
  metadata:
    name: cattle-monitoring-system
- apiVersion: v1
  kind: Namespace
  metadata:
    name: cattle-logging-system
- apiVersion: v1
  kind: ServiceAccount
  metadata:
    annotations:
      meta.helm.sh/release-name: rancher-monitoring
      meta.helm.sh/release-namespace: cattle-monitoring-system
    labels:
      app: rancher-monitoring-operator
      app.kubernetes.io/component: prometheus-operator
      app.kubernetes.io/instance: rancher-monitoring
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/name: rancher-monitoring-prometheus-operator
      heritage: Helm
      release: rancher-monitoring
    name: rancher-monitoring-operator
    namespace: cattle-monitoring-system
- apiVersion: v1
  kind: Secret
  metadata:
    name: tls-ingress
    namespace: cattle-system
  type: Opaque
  data:
    tls.crt: Cg==
    tls.key: Cg==
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: harvester-expose
    namespace: harvester-system
  spec:
    rules:
    - http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: harvester
              port:
                number: 8080
- apiVersion: v1
  kind: ConfigMap
  metadata:
    namespace: cattle-fleet-system
    name: harvester-fleet-config
  data:
    system-upgrade-controller-fleet.yaml: |
      defaultNamespace: cattle-system
      helm:
        repo: http://harvester-cluster-repo.cattle-system.svc/charts
        version: {{ .SystemUpgradeControllerChartVersion }}
        chart: system-upgrade-controller
        releaseName: system-upgrade-controller
        takeOwnership: true
        timeoutSeconds: 600
        maxHistory: 10
        values:
          global:
            cattle:
              psp:
                enabled: false
      targets:
      - clusterName: local
    harvester-crd-fleet.yaml: |
      defaultNamespace: harvester-system
      helm:
        repo: http://harvester-cluster-repo.cattle-system.svc/charts
        version: {{ .HarvesterChartVersion }}
        chart: harvester-crd
        releaseName: harvester-crd
        takeOwnership: true
        timeoutSeconds: 600
        maxHistory: 10
      targets:
      - clusterName: local
    harvester-fleet.yaml: |
      defaultNamespace: harvester-system
      helm:
        repo: http://harvester-cluster-repo.cattle-system.svc/charts
        version: {{ .HarvesterChartVersion }}
        chart: harvester
        releaseName: harvester
        takeOwnership: true
        timeoutSeconds: 600
        maxHistory: 10
        values:
          {{- if .Vip }}
          service:
            vip:
              enabled: true
              mode: "{{ .VipMode }}"
              ip: "{{ .Vip }}"
              hwAddress: "{{ .VipHwAddr }}"
          {{- end }}
          {{- if .Harvester.StorageClass.ReplicaCount }}
          storageClass:
            replicaCount: {{ .Harvester.StorageClass.ReplicaCount }}
          {{- end }}
          {{- if .Harvester.EnableGoCoverDir }}
          enableGoCoverDir: true
          {{- end }}
          kubevirt:
            spec:
              monitorAccount: rancher-monitoring-operator
              monitorNamespace: cattle-monitoring-system
          containers:
            apiserver:
              image:
                imagePullPolicy: "IfNotPresent"
              hciMode: true
          multus:
            enabled: false
          longhorn:
            enabled: true
            defaultSettings:
              taintToleration: "kubevirt.io/drain:NoSchedule"
              defaultDataPath: "/var/lib/harvester/defaultdisk"
              {{- if .Harvester.Longhorn.DefaultSettings.GuaranteedInstanceManagerCPU }}
              guaranteedInstanceManagerCPU: {{ .Harvester.Longhorn.DefaultSettings.GuaranteedInstanceManagerCPU }}
              {{- end }}
              {{- if .Harvester.Longhorn.DefaultSettings.StorageReservedPercentageForDefaultDisk }}
              storageReservedPercentageForDefaultDisk: "{{ .Harvester.Longhorn.DefaultSettings.StorageReservedPercentageForDefaultDisk }}"
              {{- end }}
              detachManuallyAttachedVolumesWhenCordoned: true
              nodeDrainPolicy: "allow-if-replica-is-stopped"
          harvester-network-controller:
            enabled: true
            vipEnabled: true
            image:
              pullPolicy: "IfNotPresent"
          harvester-networkfs-manager:
            enabled: true
            image:
              pullPolicy: "IfNotPresent"
          harvester-node-disk-manager:
            enabled: true
            image:
              pullPolicy: "IfNotPresent"
            labelFilter:
              - "COS_*"
              - "HARV_*"
          rancherEmbedded: true
          webhook:
            image:
              imagePullPolicy: "IfNotPresent"
          harvester-load-balancer:
            enabled: true
          kube-vip:
            enabled: true
          kube-vip-cloud-provider:
            enabled: true
          promote:
            clusterPodCIDR: {{ or .ClusterPodCIDR "10.52.0.0/16" }}
            clusterServiceCIDR: {{ or .ClusterServiceCIDR "10.53.0.0/16" }}
            clusterDNS: {{ or .ClusterDNS "10.53.0.10" }}
      diff:
        comparePatches:
        - apiVersion: storage.k8s.io/v1
          jsonPointers:
          - /metadata/annotations
          kind: StorageClass
          name: harvester-longhorn
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: engineimages.longhorn.io
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: nodes.longhorn.io
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: volumes.longhorn.io
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: settings.longhorn.io
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: replicas.longhorn.io
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: instancemanagers.longhorn.io
        - apiVersion: apiextensions.k8s.io/v1
          jsonPointers:
          - /status/acceptedNames
          - /status/conditions
          - /status/storedVersions
          kind: CustomResourceDefinition
          name: engines.longhorn.io
      targets:
      - clusterName: local
    rancher-monitoring-crd-fleet.yaml: |
      defaultNamespace: cattle-monitoring-system
      helm:
        repo: http://harvester-cluster-repo.cattle-system.svc/charts
        version: {{ .MonitoringChartVersion }}
        chart: rancher-monitoring-crd
        releaseName: rancher-monitoring-crd
        takeOwnership: true
        timeoutSeconds: 600
        maxHistory: 10
      targets:
      - clusterName: local
    rancher-logging-crd-fleet.yaml: |
      defaultNamespace: cattle-logging-system
      helm:
        repo: http://harvester-cluster-repo.cattle-system.svc/charts
        version: {{ .LoggingChartVersion }}
        chart: rancher-logging-crd
        releaseName: rancher-logging-crd
        takeOwnership: true
        timeoutSeconds: 600
        maxHistory: 10
      targets:
      - clusterName: local
    kubeovn-operator-crd-fleet.yaml: |
      defaultNamespace: kube-system
      helm:
        repo: http://harvester-cluster-repo.cattle-system.svc/charts
        version: {{ .KubeovnOperatorChartVersion }}
        chart: kubeovn-operator-crd
        releaseName: kubeovn-operator-crd
        takeOwnership: true
        timeoutSeconds: 600
        maxHistory: 10
      targets:
      - clusterName: local
- apiVersion: batch/v1
  kind: Job
  metadata:
    name: system-upgrade-controller-fleet
    namespace: cattle-fleet-system
  spec:
    template:
      spec:
        containers:
        - name: system-upgrade-controller-fleet
          image: rancher/fleet:{{ .FleetVersion }}
          command: ["fleet"]
          args:
          - "apply"
          - "system-upgrade-controller"
          - "/app"
          volumeMounts:
          - name: config-volume
            mountPath: "/app/fleet.yaml"
            subPath: system-upgrade-controller-fleet.yaml
            readOnly: false
        restartPolicy: Never
        volumes:
        - name: config-volume
          configMap:
            name: harvester-fleet-config
        serviceAccount: fleet-controller
        serviceAccountName: fleet-controller
- apiVersion: batch/v1
  kind: Job
  metadata:
    name: harvester-crd-fleet
    namespace: cattle-fleet-system
  spec:
    template:
      spec:
        containers:
        - name: harvester-crd-fleet
          image: rancher/fleet:{{ .FleetVersion }}
          command: ["fleet"]
          args:
          - "apply"
          - "harvester-crd"
          - "/app"
          volumeMounts:
          - name: config-volume
            mountPath: "/app/fleet.yaml"
            subPath: harvester-crd-fleet.yaml
            readOnly: false
        restartPolicy: Never
        volumes:
        - name: config-volume
          configMap:
            name: harvester-fleet-config
        serviceAccount: fleet-controller
        serviceAccountName: fleet-controller
- apiVersion: batch/v1
  kind: Job
  metadata:
    name: harvester-fleet
    namespace: cattle-fleet-system
  spec:
    template:
      spec:
        containers:
        - name: harvester-fleet
          image: rancher/fleet:{{ .FleetVersion }}
          command: ["fleet"]
          args:
          - "apply"
          - "harvester"
          - "/app"
          volumeMounts:
          - name: config-volume
            mountPath: "/app/fleet.yaml"
            subPath: harvester-fleet.yaml
            readOnly: false
        restartPolicy: Never
        volumes:
        - name: config-volume
          configMap:
            name: harvester-fleet-config
        serviceAccount: fleet-controller
        serviceAccountName: fleet-controller
- apiVersion: helm.cattle.io/v1
  kind: HelmChartConfig
  metadata:
    name: rke2-traefik
    namespace: kube-system
  spec:
    valuesContent: |-
      logs:
        access:
          enabled: "true"
      service:
        spec:
          type: LoadBalancer
      additionalArguments:
      - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=30m
      - --entryPoints.websecure.transport.respondingTimeouts.writeTimeout=30m
